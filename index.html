<section id="free-diagnostic"><div class="eyebrow" data-en="Find your starting point" data-es="Descubre tu punto de partida"></div><h2 data-en="Free Computer Science diagnostic" data-es="Diagnóstico gratuito de informática"></h2><p data-en="Identify strengths and topics to work on with an OCR-aligned assessment. Rolando reviews your answers and emails personalised recommendations. No tuition booking is required." data-es="Identifica tus fortalezas y los temas que necesitas reforzar con una evaluación alineada con OCR. Rolando revisará tus respuestas y enviará recomendaciones por correo. No es necesario contratar clases."></p><div class="split"><article><h3>GCSE · OCR J277</h3><p data-en="15–20 minutes · Multiple choice, true/false, checkboxes and grids" data-es="15–20 minutos · Opción múltiple, verdadero/falso, casillas y tablas"></p><a id="diagnostic-gcse" class="cta" target="_blank" rel="noopener" data-en="Start GCSE diagnostic" data-es="Iniciar diagnóstico GCSE"></a></article><article><h3>A Level · OCR H446</h3><p data-en="20–25 minutes · Multiple choice, true/false, checkboxes and grids" data-es="20–25 minutos · Opción múltiple, verdadero/falso, casillas y tablas"></p><a id="diagnostic-alevel" class="cta" target="_blank" rel="noopener" data-en="Start A Level diagnostic" data-es="Iniciar diagnóstico A Level"></a></article></div><p class="subtle" data-en="One free diagnostic and written review per student across both languages: choose GCSE OR A Level. Assessment questions open in your selected website language and use closed-response formats. Personalised feedback is available in English or Spanish. Work independently without notes, web searches or AI. For under-18s, a parent or carer should supervise submission and supply contact details. This samples selected topics and is not a predicted exam grade." data-es="Un diagnóstico y una evaluación escrita gratuitos por alumno entre ambos idiomas: elige GCSE O A Level. Las preguntas se abren en el idioma seleccionado en la web y son de respuesta cerrada. Los comentarios personalizados están disponibles en inglés o español. Trabaja sin apuntes, búsquedas ni IA. Para menores de 18 años, un responsable debe supervisar el envío y aportar sus datos de contacto. Es una muestra de temas, no una predicción de nota."></p><details><summary data-en="Further progress assessments" data-es="Evaluaciones adicionales de progreso"></summary><p data-en="Additional assessments with fresh questions are available by arrangement: £15 with written feedback, or £25 including a 30-minute feedback session. Contact Rolando first to agree the assessment and payment. Submitting again does not automatically create a paid booking." data-es="Evaluaciones adicionales con preguntas nuevas, previo acuerdo: £15 con comentarios escritos o £25 incluyendo una sesión de 30 minutos. Contacta primero con Rolando para acordar la evaluación y el pago. Volver a enviar un formulario no genera una reserva de pago automáticamente."></p><a href="#enquiry" data-en="Enquire about a progress assessment" data-es="Consultar una evaluación de progreso"></a></details></section><section id="availability"><div class="eyebrow" data-en="Evenings and weekends" data-es="Tardes y fines de semana"></div><h2 data-en="Lesson availability" data-es="Disponibilidad de clases"></h2><ul><li data-en="Tuesday and Thursday: from 6pm" data-es="Martes y jueves: a partir de las 18:00"></li><li data-en="Monday, Wednesday and Friday: from 7pm" data-es="Lunes, miércoles y viernes: a partir de las 19:00"></li><li data-en="Saturday and Sunday: 1pm–5pm" data-es="Sábados y domingos: de 13:00 a 17:00"></li></ul><p class="subtle" data-en="All times are UK local time (Europe/London: GMT or BST depending on the season). These are availability windows; individual lesson times are confirmed after enquiry. Weekend lessons finish by 5pm." data-es="Todos los horarios corresponden a la hora local del Reino Unido (Europe/London: GMT o BST según la época). Son franjas de disponibilidad; cada clase se confirma tras la consulta. Las clases del fin de semana terminan a las 17:00."></p></section><section id="enquiry"><h2 data-en="Enquire about tuition" data-es="Consulta sobre las clases"></h2><div class="enquiry-panel"><p data-en="Complete the enquiry form to share your goals, course and preferred times. For under-18s, a parent or carer should submit the enquiry." data-es="Completa el formulario para indicar tus objetivos, curso y disponibilidad. Para menores de 18 años, debe enviarlo un padre, madre o tutor."></p><a class="cta" href="https://docs.google.com/forms/d/e/1FAIpQLSd6l3H6WZaiURXM4bSTPZrlqcJSQqMv0wKnPB-zfbxLROJS-A/viewform" target="_blank" rel="noopener" data-en="Open tuition enquiry form" data-es="Abrir formulario de consulta"></a><p class="subtle" data-en="Opens Google Forms in a new tab. Submit the form to send your enquiry; no email application is needed." data-es="Abre Google Forms en una pestaña nueva. Envía el formulario para realizar tu consulta; no necesitas una aplicación de correo."></p></div></section><footer><p data-en="Rolando Valdés · Online Computer Science Tuition · Independent online tuition" data-es="Rolando Valdés · Clases online de informática · Clases online independientes"></p><p><a href="https://rvdez2015.github.io/rolandocvaldeshernandez/" target="_blank" rel="noopener" data-en="View professional portfolio" data-es="Ver portfolio profesional"></a></p><details><summary data-en="Privacy and enquiries" data-es="Privacidad y consultas"></summary><p data-en="Enquiries submitted through Google Forms are stored in Google Forms and Sheets and emailed to Rolando Valdés at staffcomplete1707@gmail.com to respond and arrange tuition. Please email to request deletion of enquiry correspondence. This website uses no advertising or analytics cookies; the learning profile stays in this page until you choose to download, copy or email it. No profile is sent automatically." data-es="Las consultas enviadas mediante Google Forms se guardan en Google Forms y Sheets y se notifican por correo a Rolando Valdés en staffcomplete1707@gmail.com para responder y organizar las clases. Puedes solicitar por correo la eliminación de tu consulta. La web no utiliza cookies publicitarias ni analíticas; el perfil de aprendizaje permanece en esta página hasta que decidas descargarlo, copiarlo o enviarlo por correo. No se envía automáticamente."></p></details></footer>

const text={en:{strong:'Strong',medium:'Medium',weak:'Weak',unrated:'Not rated',rated:'rated',of:'of',topics:'topics',none:'Rate at least one topic to build your summary.',no:'None selected',next:'A possible tuition starting point',weakNext:'Start with a short explanation, worked example and guided practice on your weak topics. Check understanding with a new independent task.',mediumNext:'Use targeted practice and feedback to build consistency on your medium topics.',strongNext:'Stretch your strong topics with unfamiliar applications and timed questions.',note:'Rolando will review this self-assessment with you before agreeing a learning plan. NEA help develops skills through separate practice; assessed work must remain your own.',title:'COMPUTER SCIENCE LEARNING PROFILE',goals:'Goals / untaught topics',learner:'Learner',year:'Year group',anon:'Not supplied',copied:'Full summary copied. Paste it into your email or enquiry form.',copyFail:'Copy was unavailable. Download the profile instead.',download:'Full profile downloaded. You can attach it to your email.',email:'Your email app should open with a short summary. Attach the downloaded profile for every rating. No email has been sent by this website.',reset:'Ratings cleared for this course. Your other course and optional details are unchanged.',subject:'Tuition enquiry: learning profile',short:'Short priority summary. Please attach your downloaded full profile.',more:'More topics are included in the downloadable full profile.'},es:{strong:'Fuerte',medium:'Medio',weak:'Débil',unrated:'Sin valorar',rated:'valorados',of:'de',topics:'temas',none:'Valora al menos un tema para crear tu resumen.',no:'Ninguno seleccionado',next:'Un posible punto de partida para las clases',weakNext:'Empezar con una explicación breve, un ejemplo resuelto y práctica guiada de los temas débiles. Comprobar la comprensión con una nueva tarea independiente.',mediumNext:'Practicar de forma focalizada y recibir comentarios para ganar seguridad en los const answers={J277:{},H446:{}};let active='J277';
const $=id=>document.getElementById(id),lang=()=>root.lang==='es'?'es':'en',t=()=>text[lang()];
function flat(){return courses[active].flatMap((g,gi)=>g[3].map((row,ri)=>({id:`${gi}-${ri}`,code:row[0],name:row[lang()==='es'?2:1],group:g[lang()==='es'?2:1]})));}
function el(tag,content,cls){const n=document.createElement(tag);if(content!==undefined)n.textContent=content;if(cls)n.className=cls;return n;}
function status(message){$('profile-action-status').textContent=message;}
function render(){const container=$('profile-topics');const open=new Set([...container.querySelectorAll('details[open]')].map(n=>n.dataset.group));container.replaceChildren();
courses[active].forEach((group,gi)=>{const d=el('details');d.dataset.group=String(gi);d.open=open.has(String(gi))||gi===0;const summary=el('summary',`${group[0]} · ${group[lang()==='es'?2:1]}`);d.append(summary);
group[3].forEach((row,ri)=>{const id=`${gi}-${ri}`,name=row[lang()==='es'?2:1];const field=el('fieldset',undefined,'profile-row');field.append(el('legend',`${row[0]} · ${name}`));const options=el('div',undefined,'rating-options');['strong','medium','weak'].forEach(value=>{const label=el('label');const input=el('input');input.type='radio';input.name=`profile-${active}-${id}`;input.value=value;input.checked=answers[active][id]===value;input.setAttribute('aria-label',`${name}: ${t()[value]}`);input.addEventListener('change',()=>{answers[active][id]=value;update();status('');});label.append(input,el('span',t()[value]));options.append(label);});field.append(options);d.append(field);});container.append(d);});update();}
function update(){const all=flat();const rated=all.filter(x=>answers[active][x.id]);const counts={strong:0,medium:0,weak:0};rated.forEach(x=>counts[answers[active][x.id]]++);$('profile-counts').textContent=`${rated.length} ${t().of} ${all.length} ${t().topics} ${t().rated} · ${t().strong}: ${counts.strong} · ${t().medium}: ${counts.medium} · ${t().weak}: ${counts.weak} · ${t().unrated}: ${all.length-rated.length}`;
const summary=$('profile-summary');summary.replaceChildren();if(!rated.length)summary.append(el('p',t().none));else ['weak','medium','strong'].forEach(value=>{const group=el('div');group.append(el('h4',t()[value]));const list=el('ul');const rows=rated.filter(x=>answers[active][x.id]===value);if(rows.length)rows.forEach(x=>list.append(el('li',`${x.code} · ${x.name}`)));else list.append(el('li',t().no));group.append(list);summary.append(group);});
const suggestions=$('profile-suggestions');suggestions.replaceChildren();if(rated.length){suggestions.append(el('h4',t().next));['weak','medium','strong'].forEach(value=>{if(counts[value])suggestions.append(el('p',t()[value+'Next']));});suggestions.append(el('p',t().note,'subtle'));}
['profile-download','profile-copy','profile-email'].forEach(id=>$(id).disabled=!rated.length);$('profile-reset').disabled=!rated.length;}
function report(){const lines=[t().title,`${active==='J277'?'GCSE':'A Level'} · OCR ${active}`,`${t().learner}: ${$('profile-name').value.trim()||t().anon}`,`${t().year}: ${$('profile-year').value.trim()||t().anon}`,`${t().goals}: ${$('profile-goals').value.trim()||t().anon}`,'',$('profile-counts').textContent,''];['weak','medium','strong'].forEach(v=>{lines.push(t()[v].toUpperCase());const rows=flat().filter(x=>answers[active][x.id]===v);lines.push(...(rows.length?rows.map(x=>`${x.code} · ${x.name}`):[t().no]),'');});lines.push(`${t().unrated}:`,...flat().filter(x=>!answers[active][x.id]).map(x=>`${x.code} · ${x.name}`),'',t().note);return lines.join('\n');}
root.querySelectorAll('[data-course]').forEach(button=>button.addEventListener('click',()=>{active=button.dataset.course;root.querySelectorAll('[data-course]').forEach(x=>x.setAttribute('aria-pressed',String(x===button)));$('profile-topics').replaceChildren();render();status('');}));
root.querySelectorAll('[data-lang]').forEach(button=>button.addEventListener('click',()=>{render();status('');}));
$('profile-download').addEventListener('click',()=>{const blob=new Blob(['\uFEFF'+report()],{type:'text/plain;charset=utf-8'});const url=URL.createObjectURL(blob);const a=el('a');a.href=url;a.download=`learning-profile-${active}-${lang()}.txt`;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);status(t().download);});
$('profile-copy').addEventListener('click',async()=>{try{await navigator.clipboard.writeText(report());status(t().copied);}catch(e){status(t().copyFail);}});
$('profile-email').addEventListener('click',()=>{const ranked=flat().filter(x=>answers[active][x.id]).sort((a,b)=>['weak','medium','strong'].indexOf(answers[active][a.id])-['weak','medium','strong'].indexOf(answers[active][b.id]));const intro=`${t().short}\nOCR ${active}\n${t().learner}: ${$('profile-name').value.trim().slice(0,60)||t().anon}\n${t().year}: ${$('profile-year').value.trim().slice(0,40)||t().anon}\n${t().goals}: ${$('profile-goals').value.trim().slice(0,150)}\n${$('profile-counts').textContent}\n`;
let body=intro,used=0;for(const row of ranked){const line=`\n${t()[answers[active][row.id]]}: ${row.code} ${row.name}`;if(encodeURIComponent(body+line).length>1250)break;body+=line;used++;}if(used<ranked.length)body+='\n'+t().more;const a=el('a');a.href=`mailto:staffcomplete1707@gmail.com?subject=${encodeURIComponent(t().subject+' — OCR '+active)}&body=${encodeURIComponent(body)}`;document.body.append(a);a.click();a.remove();status(t().email);});
$('profile-reset').addEventListener('click',()=>{answers[active]={};render();status(t().reset);});render();
})();
</script></body></html>
